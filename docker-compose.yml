services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agency:agency@db:5432/agency
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE: redis://redis:6379/1
    volumes: [./backend:/srv]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    volumes: [./web:/app, /app/node_modules, /app/.next]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
